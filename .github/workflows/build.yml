name: Build

# The four gates on GitHub, for the mirror of this repository there.
#
# The same four as `.forgejo/workflows/build.yml`, which is the one that runs
# on the Forgejo where development happens. The two differ only in plumbing:
# GitHub's runners can fetch published actions, so the checkout and the
# toolchain are one step each, and there is no persistent target directory to
# share -- every GitHub-hosted runner is fresh, so a cache action stands in.
#
# **The `if:` on the job is not decoration.** Forgejo reads `.github/workflows`
# as well as `.forgejo/workflows`, so without it this file would also run on
# the Forgejo, fail on the first `uses:` (that instance cannot fetch published
# actions, forgejo#2809) and turn every push red. On the Forgejo this job is
# skipped; on GitHub it runs. `github.server_url` is set on both.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # A failed crate download should not fail a build.
  CARGO_NET_RETRY: "10"

defaults:
  run:
    shell: pwsh

jobs:
  check:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      # -D warnings, so a warning fails the build rather than scrolling past.
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # The binary is the product, so its size is worth watching: the whole
      # argument for raw Win32 over a GUI toolkit was ~500 KB against ~10 MB.
      - name: Size
        run: |
          $exe = Get-Item target/release/LockScreen.exe
          "LockScreen.exe {0:N0} bytes ({1:N0} KB)" -f $exe.Length, ($exe.Length / 1KB)
