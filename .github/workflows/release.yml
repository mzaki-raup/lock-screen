name: Release

# Publishes a release on GitHub for a tag that was made on the Forgejo.
#
# **This workflow never decides a version.** The Forgejo is the version
# authority: a release is made by setting the version in Cargo.toml, tagging
# `vX.Y.Z` there, and pushing the tag to both forges. This job only sees a tag
# that already exists, checks it against Cargo.toml exactly as the Forgejo job
# does, builds the same source, and publishes what it built *here*. Two forges
# that each bumped versions would drift apart in a week.
#
# What differs from `.forgejo/workflows/release.yml`, and why:
#
#   LOCKSCREEN_RELEASES_API   points the built copy at GitHub's releases API,
#                             so a copy downloaded from GitHub updates from
#                             GitHub. The Forgejo job points its copy at the
#                             Forgejo. Same source, two binaries.
#   No Sign step              releases are unsigned on both forges, decided on
#                             9 October 2026; see PARITY.md section 4. When a
#                             signing service is chosen it goes in both.
#   `gh release create`       instead of the Forgejo's REST calls. The assets
#                             are identical: LockScreen.exe, SHA256SUMS.txt and
#                             the zip, and without SHA256SUMS.txt the app must
#                             refuse to install the release by itself.
#
# The `if:` on the job keeps this off the Forgejo, which reads this directory
# too and cannot fetch published actions. See build.yml.
#
# **Re-running for a tag that already exists.** The Forgejo and GitHub publish
# the same tag independently, so one can succeed while the other fails -- as
# v0.2.8 did here, on a preflight bug, after the Forgejo had already published
# it. Re-tagging is not an option then: the Forgejo release is attached to the
# commit the tag names. So the manual trigger takes a tag, checks that tag's
# source out, and runs the rest exactly as a push would. Actions tab, Release,
# "Run workflow", type the tag. The workflow *definition* is the branch's;
# the *source built* is the tag's.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to publish, e.g. v0.2.8, when its push-triggered run failed'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_NET_RETRY: "10"

defaults:
  run:
    shell: pwsh

jobs:
  release:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      # Not shallow, and with every tag: the notes below are the commits since
      # the previous tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # `tag` is decided once, here, and every later step reads it from this
      # output: a push names it in `github.ref_name`, a manual run in the input.
      - name: The tag must match the version in Cargo.toml
        id: version
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "'$tag' is not a release tag of the form vX.Y.Z" }
          $version = $tag -replace '^v', ''
          $inCargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($version -ne $inCargo) {
            # The app compares the published tag against the version it was
            # built with, so a mismatch would offer the same update for ever.
            throw "Tag $tag does not match Cargo.toml version $inCargo"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # A second release for one tag is refused, and that refusal arriving
      # after the build is what this step is for. The Forgejo job learned this
      # the expensive way at v0.1.1.
      - name: Nothing may already be published for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh` exits 1 and says "release not found", which is the answer we
          # want. Two things about GitHub's pwsh steps make that awkward: they
          # run with ErrorActionPreference=Stop, under which a native command
          # writing to stderr has been a terminating error on some PowerShell
          # versions; and the wrapper ends every step with `exit $LASTEXITCODE`,
          # so the 1 that gh leaves behind failed this step at v0.2.8 even
          # though the check itself had passed. Hence the relaxed preference,
          # and the exit code being read, judged, and then put back to 0.
          $ErrorActionPreference = 'Continue'
          gh release view "${{ steps.version.outputs.tag }}" 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            throw "a release for ${{ steps.version.outputs.tag }} already exists. Delete it, or tag a new version."
          }
          Write-Host "preflight ok: ${{ steps.version.outputs.tag }} is not yet released on GitHub"

      - name: Release notes from the commits since the last tag
        run: |
          $previous = git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>$null
          $range = if ($previous) { "$previous..${{ steps.version.outputs.tag }}" } else { "${{ steps.version.outputs.tag }}" }
          $log = git log --no-merges --pretty=format:"- %s" $range
          $notes = if ($log) { $log -join "`n" } else { "No changes recorded." }
          $notes | Set-Content notes.md -Encoding utf8
          Get-Content notes.md

      - name: Use the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # The gates run with the same variable as the build, so the test that
      # checks the baked-in URL checks the one this release will carry.
      - name: Tests
        env:
          LOCKSCREEN_RELEASES_API: https://api.github.com/repos/${{ github.repository }}/releases?per_page=10
        run: cargo test --locked

      - name: Clippy
        env:
          LOCKSCREEN_RELEASES_API: https://api.github.com/repos/${{ github.repository }}/releases?per_page=10
        run: cargo clippy --release --all-targets --locked -- -D warnings

      # The one line that makes this binary a GitHub one. Derived from the
      # repository this job runs in rather than written out, so a fork or a
      # rename does not ship copies that update from somebody else's releases.
      - name: Build
        env:
          LOCKSCREEN_RELEASES_API: https://api.github.com/repos/${{ github.repository }}/releases?per_page=10
        run: cargo build --release --locked

      - name: Checksums and archive
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/LockScreen.exe dist/
          Copy-Item README.md dist/
          $zip = "LockScreen-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/LockScreen.exe, dist/README.md -DestinationPath "dist/$zip"
          Remove-Item dist/README.md
          # `sha256sum` layout, which the updater parses.
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # Unsigned, and said so in the log, as the Forgejo job says it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Warning 'No signing certificate configured: this release is UNSIGNED.'
          gh release create "${{ steps.version.outputs.tag }}" `
            --title "LockScreen ${{ steps.version.outputs.version }}" `
            --notes-file notes.md `
            --verify-tag `
            (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
