name: Release

# Tag a commit `v2.0.0` and push the tag: this runs the same gates as build.yml,
# then publishes the program as a release.
#
# What it publishes, and what the in-app updater (phase 07) will read:
#
#   LockScreen.exe                       the program, downloaded in place
#   SHA256SUMS.txt                       checked before anything is replaced
#   LockScreen-<version>-windows-x64.zip for people who update by hand
#
# Without SHA256SUMS.txt the app must refuse to install the release by itself,
# so never publish one of these without the other.
#
# As in build.yml, nothing here uses a published action: this instance cannot
# fetch them from code.forgejo.org (forgejo#2809).
#
# The steps are ordered so that everything cheap runs first: the version check,
# the publish preflight and the release notes all need nothing but the checkout,
# and together they take seconds. Only then does the job install a toolchain and
# build. A release that cannot be published should not spend four minutes
# finding that out -- which is exactly what v0.1.1 did.
#
# **Push the tag on its own**, after the branch has landed:
#
#   git push origin main
#   git push origin v2.0.0
#
# Pushing both in one command raises two events at once, and the forge has been
# seen to end up without its own row for the tag -- which fails the publish step
# below after every expensive step has already passed. The `target_commitish`
# there now survives that, but one ref per push is still the habit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out this tag, with the history the notes need
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem -Force . | Remove-Item -Recurse -Force
          git init --quiet --initial-branch=release .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          # Not shallow, and with every tag: the notes below are the commits
          # since the previous tag.
          git -c $auth fetch --quiet --tags origin
          git checkout --quiet --detach ${{ github.sha }}
          git log --oneline -1

      - name: The tag must match the version in Cargo.toml
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          # The version lives in the workspace manifest, under [workspace.package].
          $inCargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($version -ne $inCargo) {
            # The app compares the published tag against the version it was
            # built with, so a mismatch would offer the same update for ever.
            throw "Tag $tag does not match Cargo.toml version $inCargo"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Everything that could stop this release being published, asked now.
      #
      # v0.1.1 is why this step exists. It passed rustup, the four gates, the
      # build, the signing step, the checksums and the archive, and then failed
      # on the final POST -- four minutes spent to discover something that was
      # already true when the job started. A release that cannot be published
      # should say so in seconds, and should say which of these it was.
      - name: Check now whatever would otherwise fail the publish at the end
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
        run: |
          $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $env:TOKEN" }

          # 1. The token works and the API is reachable at all.
          try {
            $repo = Invoke-RestMethod -Uri $api -Headers $headers -ErrorAction Stop
          } catch {
            throw "the repository API could not be read with this job's token: $($_.Exception.Message)"
          }
          # A warning, not a failure. The forge does report `permissions` --
          # an unauthenticated read of this endpoint says `push: false` -- but
          # whether the Actions token reports `true` there has never been
          # observed, and a check that blocks every release because it
          # misreads a field it cannot be sure of is worse than the late
          # failure it was meant to replace. The authenticated GET below is the
          # real evidence that this token can talk to the releases API.
          if ($repo.PSObject.Properties['permissions'] -and -not $repo.permissions.push) {
            Write-Warning "the API reports no push permission for $($repo.full_name); if the publish step fails, that is why"
          }

          # 2. Nothing is published for this tag yet. A second release for one
          #    tag is refused, and that refusal arriving after the build is the
          #    whole reason for this step.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "$api/releases/tags/${{ github.ref_name }}" -Headers $headers -ErrorAction Stop
          } catch {
            $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            # 404 is the answer we want: nothing released under this tag.
            if ($code -ne 404) {
              throw "could not ask whether ${{ github.ref_name }} is already released (HTTP $code): $($_.Exception.Message)"
            }
          }
          if ($existing) {
            throw "a release for ${{ github.ref_name }} already exists at $($existing.html_url). Delete it, or tag a new version."
          }

          # 3. If a certificate is configured, the signing step has to be able
          #    to use it. A malformed secret or a runner with no signtool is
          #    another thing not worth discovering after a build.
          if ($env:CERT_PFX_BASE64) {
            try {
              [Convert]::FromBase64String($env:CERT_PFX_BASE64) | Out-Null
            } catch {
              throw 'CERT_PFX_BASE64 is set but is not valid base64'
            }
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $signtool) {
              throw 'a signing certificate is configured but signtool.exe was not found on this runner'
            }
          } else {
            Write-Warning 'No signing certificate configured: this release will be UNSIGNED.'
          }

          Write-Host "preflight ok: $($repo.full_name) is writable, ${{ github.ref_name }} is not yet released"

      - name: Release notes from the commits since the last tag
        run: |
          $previous = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          $range = if ($previous) { "$previous..${{ github.ref_name }}" } else { "${{ github.ref_name }}" }
          $log = git log --no-merges --pretty=format:"- %s" $range
          $notes = if ($log) { $log -join "`n" } else { "No changes recorded." }
          $notes | Set-Content notes.md -Encoding utf8
          Get-Content notes.md

      - name: Use the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # Authenticode. The only thing that protects an install against a
      # compromise of this forge: SHA256SUMS travels the same channel as the
      # binary, so an attacker who can publish a release can publish both.
      # Windows checks the publisher at launch however the file arrived.
      #
      # Skipped, with a warning in the log, when no certificate is configured --
      # so a release is still possible before one exists, and it is obvious in
      # the job output which releases are unsigned.
      - name: Sign
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Warning "No signing certificate configured: this release will be UNSIGNED."
            Write-Warning "Set the CERT_PFX_BASE64 and CERT_PASSWORD secrets to sign it."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:CERT_PASSWORD target/release/LockScreen.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          # Remove it from the runner even though the runner is ephemeral.
          Remove-Item $pfx -Force
          & $signtool verify /pa /v target/release/LockScreen.exe

      - name: Checksums and archive
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/LockScreen.exe dist/
          Copy-Item README.md dist/
          $zip = "LockScreen-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/LockScreen.exe, dist/README.md -DestinationPath "dist/$zip"
          Remove-Item dist/README.md
          # `sha256sum` layout, which the updater parses.
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          # Forgejo hands the workflow a token with write access to this
          # repository; the API below is its /api/v1, not GitHub's. Who the
          # release is shown as coming from does not depend on this token: the
          # forge matches the tag's own author email to an account, so a tag
          # made with an email that account does not own is published by
          # "Ghost".
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $env:TOKEN" }
          # `target_commitish` is not optional in practice, even though the
          # tag always exists in git by the time this runs. Forgejo keeps its
          # own row per tag, and when a branch and a tag arrive in the same
          # `git push` that row can be missing while `/tags` still lists the
          # tag -- at which point this POST is refused with
          # "Release is has no Tag" after the build has already succeeded.
          # Naming the commit lets the forge attach the release itself instead
          # of depending on that row. See the header comment: push the tag as
          # its own push, too.
          $body = @{
            tag_name         = "${{ github.ref_name }}"
            target_commitish = "${{ github.sha }}"
            name             = "Lock Screen ${{ steps.version.outputs.version }}"
            body             = (Get-Content notes.md -Raw)
            draft            = $false
            prerelease       = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers `
            -ContentType 'application/json' -Body $body
          Write-Host "Release $($release.id) created at $($release.html_url)"
          foreach ($file in Get-ChildItem dist -File) {
            $uri = "$api/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($file.Name))"
            Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Form @{ attachment = Get-Item $file.FullName } | Out-Null
            Write-Host "Attached $($file.Name)"
          }
